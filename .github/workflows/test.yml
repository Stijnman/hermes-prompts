name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile repository utilities
        run: python -m py_compile check_top_repos.py
      - name: Validate JSON configuration
        run: python -m json.tool config/models.json >/dev/null
        continue-on-error: true
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
