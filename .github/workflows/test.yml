name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile repository utilities
        run: python -m py_compile check_top_repos.py
      - name: Validate required portfolio documentation
        run: |
          test -s README.md
          test -s SKILL.md
          test -s LIBRARY.md
      - name: Reject unresolved merge markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!archive/**'; then
            echo "Unresolved merge markers found"
            exit 1
          fi
